<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Kraftbuch</title>
<meta name="description" content="Privates Krafttraining-Tagebuch – offline, lokal gespeichert.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kraftbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#000; --card:#1c1c1e; --raised:#2c2c2e; --line:#38383a;
  --text:#fff; --sec:#98989f; --ter:#636366;
  --accent:#30d158; --orange:#ff9f0a; --gold:#ffd60a; --cyan:#64d2ff; --red:#ff453a; --blue:#0a84ff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.num-font,.mono{font-variant-numeric:tabular-nums}
#app{padding:calc(var(--safe-t) + 52px) 16px calc(var(--safe-b) + 96px);max-width:640px;margin:0 auto}
body.has-timer #app{padding-bottom:calc(var(--safe-b) + 160px)}

/* Kopfzeile */
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(0,0,0,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding-top:var(--safe-t)}
.top-in{max-width:640px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:8px}
.top-title{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
.top-side{min-width:84px;display:flex;align-items:center}
.top-side.r{justify-content:flex-end}
.tbtn{color:var(--accent);font-size:17px;padding:8px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.tbtn.b{font-weight:600}
.big-title{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:4px 0 14px}

/* Tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding-bottom:var(--safe-b)}
.tabs-in{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--ter);font-size:10px;font-weight:500;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:5px;background:var(--red)}

/* Bausteine */
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 7px;border-radius:99px;white-space:nowrap;vertical-align:middle;background:rgba(152,152,159,.18);color:var(--sec)}
.pill.base{background:rgba(255,159,10,.18);color:var(--orange)}
.muted{color:var(--sec)}.faint{color:var(--ter)}
.small{font-size:13px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:5px;flex:none;display:inline-block}
.section-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:800;font-size:14px;letter-spacing:.8px;text-transform:uppercase}
.section-h .bar{width:4px;height:18px;border-radius:2px}
.h2{font-size:17px;font-weight:700;margin:0 0 10px}
.chev{color:var(--ter);font-size:20px;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--card);font-size:14px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.on{border-color:currentColor}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:12px;background:var(--raised);font-weight:600;font-size:15px}
.btn.green{background:var(--accent);color:#000}
.btn.ghost{background:var(--card)}
.btn.red{color:var(--red);background:var(--card)}
.btn.orange{color:var(--orange);background:var(--card)}
.btn.sm{padding:9px;font-size:14px}
.btns{display:flex;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;min-width:0}
.tile .t{font-size:12px;color:var(--sec)}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:11px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--raised);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:500;color:var(--sec)}
.seg button.on{background:#636366;color:#fff}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:48px;width:100%;text-align:left}
.li+.li{border-top:.5px solid var(--line)}
.li-h{font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.3px;margin:18px 4px 6px;display:flex;align-items:center;gap:6px}
.icon-sq{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:#000}
.icon-sq svg{width:18px;height:18px}
.mini{width:34px;height:32px;border-radius:8px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none;font-size:15px}
.mini:disabled{opacity:.3}
.note{font-size:12px;color:var(--ter);margin:4px 4px 12px;line-height:1.4}
.empty{text-align:center;color:var(--sec);padding:40px 20px}
.empty b{display:block;color:#fff;font-size:18px;margin-bottom:6px}

/* Übersicht */
.ex-card{display:flex;gap:12px;width:100%;text-align:left}
.ex-card .stripe{width:3px;border-radius:2px;flex:none}
.ex-name{font-weight:600;font-size:17px}
.sets-line{font-size:15px;font-variant-numeric:tabular-nums}
.today{color:var(--accent);font-size:13px;font-weight:600}
.pr-line{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.trophy{color:var(--gold)}
.banner{display:flex;align-items:center;gap:12px;background:rgba(48,209,88,.14);border-radius:16px;padding:14px;width:100%;text-align:left;margin-bottom:6px}

/* Training */
.wk-head{display:flex;background:var(--card);border-radius:16px;padding:12px 0;margin-bottom:10px}
.wk-head>div{flex:1;text-align:center}
.wk-head>div+div{border-left:.5px solid var(--line)}
.wk-head .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-head .t{font-size:11px;color:var(--sec)}
.entry-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.entry-h b{font-size:17px}
.prev-box{background:var(--raised);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.set-head,.set-row{display:grid;grid-template-columns:38px 66px 1fr 1fr 44px;gap:7px;align-items:center}
.set-head{font-size:11px;font-weight:600;color:var(--ter);text-align:center;margin-bottom:4px}
.set-row{padding:4px 0;border-radius:10px}
.set-row.done{background:rgba(48,209,88,.12)}
.set-no{height:36px;border-radius:9px;background:var(--raised);font-weight:700;font-variant-numeric:tabular-nums}
.set-no.warm{background:rgba(255,159,10,.2);color:var(--orange)}
.prev{font-size:12px;color:var(--ter);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:100%;height:36px;border:0;border-radius:9px;background:var(--raised);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none;padding:0}
.num:focus{box-shadow:0 0 0 2px var(--accent) inset}
.num::placeholder{color:#5a5a5e;font-weight:500}
.chk{height:36px;border-radius:9px;background:var(--raised);color:var(--sec);font-size:18px;font-weight:800;position:relative}
.chk.done{background:var(--accent);color:#000}
.chk.del{background:rgba(255,69,58,.18);color:var(--red);font-size:16px}
.chk .tr{position:absolute;top:-7px;right:-6px;font-size:12px;background:#000;border-radius:9px;padding:1px 2px;line-height:1}
.pr-note{font-size:12px;font-weight:600;padding:0 0 4px 45px}
.entry-actions{display:flex;gap:8px;margin-top:8px}
.timer{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 50px);z-index:19;background:rgba(28,28,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);display:none}
body.has-timer .timer{display:block}
.timer-in{max-width:640px;margin:0 auto;padding:9px 12px;display:flex;align-items:center;gap:8px}
.tchip{height:36px;padding:0 11px;border-radius:9px;background:var(--raised);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.tchip.hl{background:rgba(48,209,88,.22);color:var(--accent)}
.t-left{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px}
.t-prog{position:absolute;left:0;top:0;height:2px;background:var(--accent);transition:width .25s linear}
body.flash .timer{animation:flash .6s 3}
@keyframes flash{50%{background:rgba(48,209,88,.5)}}

/* Verlauf */
.set-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.set-chip{background:var(--raised);border-radius:7px;padding:4px 7px;font-size:13px;font-variant-numeric:tabular-nums}
.set-chip.warm{color:var(--sec)}
.set-chip .w{color:var(--orange);font-weight:700;margin-right:3px;font-size:11px}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#151517;width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 8px;border-bottom:.5px solid var(--line)}
.sheet-h .top-title{font-size:16px}
.sheet-b{overflow-y:auto;padding:14px 16px calc(var(--safe-b) + 20px);-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sec);margin:0 4px 6px}
.inp{width:100%;background:var(--card);border:0;border-radius:11px;padding:12px;font-size:16px;outline:none}
.inp:focus{box-shadow:0 0 0 2px var(--accent) inset}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#98989f 50%),linear-gradient(135deg,#98989f 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:6px 2px}
.swatch{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:#fff}
.check{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 60px);transform:translateX(-50%);background:#2c2c2e;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;white-space:pre-line;animation:fade .2s}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sec);margin-top:6px}
</style>
</head>
<body>
<div id="top" class="top"></div>
<main id="app"></main>
<div id="timer" class="timer"></div>
<nav id="tabs" class="tabs"></nav>
<div id="modal"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   Kraftbuch – privates Trainingstagebuch (Web-App)
   Alle Daten liegen nur lokal auf diesem Gerät (localStorage).
   ========================================================= */

const KEY = 'kraftbuch.v1';
const BACKUP_KEY = 'kraftbuch.v1.sicherung';

// ---------- Hilfsfunktionen ----------
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const kg = n => { if (!isFinite(n)) return '0'; return String(Math.round(n * 100) / 100).replace('.', ','); };
const big = n => Math.round(n).toLocaleString('de-DE');
const parseNum = t => { t = String(t).trim().replace(',', '.'); if (!t) return 0; const v = parseFloat(t); return isFinite(v) && v >= 0 ? v : 0; };
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const fDate = ts => { const d = new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`; };
const fShort = ts => { const d = new Date(ts); return `${d.getDate()}. ${MON_SHORT[d.getMonth()]}`; };
const fTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fLong = ts => { const d = new Date(ts); return `${DAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fMonth = ts => { const d = new Date(ts); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const isoDay = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dayStart = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const relDays = ts => {
  const days = Math.round((dayStart(Date.now()) - dayStart(ts)) / 86400000);
  if (days === 0) return 'heute';
  if (days === 1) return 'gestern';
  if (days > 1 && days < 14) return `vor ${days} Tagen`;
  return fDate(ts);
};
const dur = ms => {
  const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
};
const bySort = (a, b) => (a.sort ?? 0) - (b.sort ?? 0);

const ICON = {
  grid:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5" y="6" width="3.2" height="12" rx="1.2"/><rect x="15.8" y="6" width="3.2" height="12" rx="1.2"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="8" y="11" width="8" height="2" rx="1"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  back:'<svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h0M3.5 12h0M3.5 18h0"/></svg>',
  hex:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="4"/><circle cx="17" cy="7" r="4"/><circle cx="12" cy="16" r="4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5 11l7-7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l-7-7M12 4v15l7-7"/></svg>',
  table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M10 4v16"/></svg>',
  timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6"/></svg>',
};
const iconSmall = (svg, size = 14) => svg.replace('<svg ', `<svg width="${size}" height="${size}" `);

// ---------- Daten ----------
let S = null;           // gespeicherter Zustand
let loadError = null;

const U = {             // Bedienzustand (nicht gespeichert)
  tab: 'overview',
  stack: { overview: [], training: [], history: [], stats: [], more: [] },
  filter: null, metric: 'heaviest', statsEx: null, showBase: false,
  editEntry: null, editSession: false, modal: null, draft: null, pickSearch: '',
  scroll: {},
};

function seedData() {
  const now = Date.now();
  const groups = [
    ['Beine', '#BF5AF2'], ['Rücken', '#FF9F0A'], ['Schultern', '#FF453A'],
    ['Arme', '#0A84FF'], ['Brust', '#FFD60A'], ['Core', '#66D4CF'],
  ].map(([name, color], i) => ({ id: uid(), name, color, sort: i }));
  const g = n => groups.find(x => x.name === n).id;
  const two = (w) => [[w, 8], [w, 8]];

  // Werte aus deinem bisherigen Plan (Screenshot). „vorher“ = links vom Pfeil, „zuletzt“ = rechts vom Pfeil.
  // Bei nur einem Wert gilt er als „zuletzt“. Keine Werte erfunden.
  const list = [
    ['Leg Extension', 'Beine', 'total', two(110), [[110, 8], [115, 8]], ''],
    ['Leg Curl', 'Beine', 'total', two(75), [[77.5, 8], [80, 8]], ''],
    ['Adductor', 'Beine', 'total', two(80), two(80), ''],
    ['Abductor', 'Beine', 'total', two(80), two(85), ''],
    ['Breiter Latzug', 'Rücken', 'total', two(65), two(65), ''],
    ['Enger Latzug', 'Rücken', 'total', two(60), [[60, 8], [65, 8]], ''],
    ['Rudern', 'Rücken', 'total', two(65), two(67.5), ''],
    ['Face Pulls', 'Rücken', 'total', null, null, 'Neu im Plan'],
    ['Schulterdrücken', 'Schultern', 'total', null, two(20), ''],
    ['Seitheben', 'Schultern', 'total', null, two(10), ''],
    ['Reverse Butterfly', 'Schultern', 'total', null, null, 'Laut altem Plan: 20–25 kg (Wiederholungen nicht notiert)'],
    ['Bizeps Curls', 'Arme', 'total', null, two(15), ''],
    ['Hammer Curls', 'Arme', 'total', null, two(16), ''],
    ['Bankdrücken flach (Langhantel)', 'Brust', 'total', null, two(54), ''],
    ['Bankdrücken schräg (Kurzhantel)', 'Brust', 'perDumbbell', null, two(24), ''],
    ['Brustpresse', 'Brust', 'total', null, two(45), ''],
  ];
  const counters = {};
  const exercises = list.map(([name, gname, mode, , , notes]) => {
    counters[gname] = (counters[gname] ?? -1) + 1;
    return { id: uid(), name, groupId: g(gname), mode, notes, sort: counters[gname] };
  });

  const mkSession = (name, start, idx) => {
    const entries = [];
    list.forEach((row, i) => {
      const sets = row[idx]; if (!sets) return;
      const ex = exercises[i], grp = groups.find(x => x.id === ex.groupId);
      entries.push({
        id: uid(), exId: ex.id, name: ex.name, group: grp.name, color: grp.color, mode: ex.mode,
        sets: sets.map(([w, r]) => ({ id: uid(), w, r, warm: false, done: true, at: start })),
      });
    });
    return { id: uid(), name, start, end: start, pausedAt: null, pausedMs: 0, baseline: true, dateUnknown: true, entries };
  };

  const plans = groups.map((gr, i) => ({
    id: uid(), name: gr.name, sort: i,
    exIds: exercises.filter(e => e.groupId === gr.id).sort(bySort).map(e => e.id),
  }));

  return {
    version: 1, createdAt: now, groups, exercises, plans,
    sessions: [
      mkSession('Ausgangswert (vorher)', now - 120000, 3),
      mkSession('Ausgangswert (zuletzt)', now - 60000, 4),
    ],
    settings: { rest: 120, autoRest: true, lastExport: 0 },
    timer: null,
  };
}

function load() {
  const raw = localStorage.getItem(KEY);
  if (raw === null) { S = seedData(); save(); return; }
  try {
    S = JSON.parse(raw);
    if (!S || !Array.isArray(S.sessions)) throw new Error('Unbekanntes Format');
    S.settings = Object.assign({ rest: 120, autoRest: true, lastExport: 0 }, S.settings || {});
    // Sicherheitskopie des Zustands beim Start (falls später etwas schiefgeht)
    try { localStorage.setItem(BACKUP_KEY, raw); } catch (_) {}
  } catch (e) {
    S = null; loadError = { message: e.message, raw };
  }
}

function save() {
  if (!S) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Speichern fehlgeschlagen – bitte Backup exportieren.'); }
}

// ---------- Abfragen ----------
const factor = m => m === 'perDumbbell' ? 2 : 1;
const unitOf = m => m === 'perDumbbell' ? 'kg/Hantel' : 'kg';
const modeLabel = m => m === 'perDumbbell' ? 'Pro Hantel' : 'Gesamtgewicht';
const working = e => e.sets.filter(s => s.done && !s.warm && s.r > 0);
const entryVol = e => working(e).reduce((a, s) => a + s.w * factor(e.mode) * s.r, 0);
const sessVol = s => s.entries.reduce((a, e) => a + entryVol(e), 0);
const sessSets = s => s.entries.reduce((a, e) => a + working(e).length, 0);
const activeSession = () => S.sessions.find(s => !s.end);
const exById = id => S.exercises.find(e => e.id === id);
const grpById = id => S.groups.find(g => g.id === id);
const sessById = id => S.sessions.find(s => s.id === id);
const planById = id => S.plans.find(p => p.id === id);
const exColor = ex => grpById(ex?.groupId)?.color || '#8E8E93';
const entryColor = e => { const ex = exById(e.exId); return ex ? exColor(ex) : (e.color || '#8E8E93'); };
const elapsed = (s, now = Date.now()) => {
  const end = s.end || now; let p = s.pausedMs || 0;
  if (s.pausedAt) p += Math.max(0, end - s.pausedAt);
  return Math.max(0, end - s.start - p);
};
const sessDate = s => s.dateUnknown ? 'Datum unbekannt' : fDate(s.start);
const setsText = sets => sets.map(s => `${kg(s.w)} × ${s.r}`).join('  ·  ');
const groupsSorted = () => [...S.groups].sort(bySort);
const exOfGroup = gid => S.exercises.filter(e => (e.groupId || null) === gid).sort(bySort);

function finished(exId) {
  const out = [];
  for (const s of S.sessions) {
    if (!s.end) continue;
    for (const e of s.entries) if (e.exId === exId && working(e).length) out.push({ s, e });
  }
  return out.sort((a, b) => b.s.start - a.s.start);
}
function performed(exId, excl = null, before = null) {
  const out = [];
  for (const s of S.sessions) {
    if (!s.end || (excl && s.id === excl) || (before != null && s.start >= before)) continue;
    for (const e of s.entries) {
      if (e.exId !== exId) continue;
      for (const set of working(e)) out.push({ id: set.id, tw: set.w * factor(e.mode), r: set.r, date: s.start, base: s.baseline, unknown: s.dateUnknown, sid: s.id });
    }
  }
  return out;
}
// Geschätztes 1RM nach Epley, nur bis 12 Wdh.
const e1rm = (w, r) => (w > 0 && r >= 1 && r <= 12) ? (r === 1 ? w : w * (1 + r / 30)) : null;

function records(exId) {
  const sets = performed(exId);
  let heaviest = null, mostReps = null, best = null, bestVal = 0;
  for (const p of sets) {
    if (!heaviest || p.tw > heaviest.tw || (p.tw === heaviest.tw && p.r > heaviest.r)) heaviest = p;
    if (!mostReps || p.r > mostReps.r || (p.r === mostReps.r && p.tw > mostReps.tw)) mostReps = p;
    const v = e1rm(p.tw, p.r); if (v && v > bestVal) { bestVal = v; best = p; }
  }
  return { heaviest, mostReps, best, bestVal, sessions: new Set(sets.map(p => p.sid)).size };
}

/* PR-Regel (nachvollziehbar):
   Gewichts-PR: Gesamtgewicht höher als jedes frühere Arbeitssatz-Gewicht.
   Wdh.-PR: mehr Wdh. als je zuvor mit diesem oder höherem Gewicht.
   Aufwärmsätze zählen nie, beim allerersten Training gibt es keinen PR. */
function prKind(tw, r, prior) {
  if (r <= 0 || !prior.length) return null;
  let maxW = 0; for (const p of prior) maxW = Math.max(maxW, p.tw);
  if (tw > maxW) return 'weight';
  let bestR = 0; for (const p of prior) if (p.tw >= tw) bestR = Math.max(bestR, p.r);
  return r > bestR ? 'reps' : null;
}
function prKinds(s, e) {
  if (!e.exId) return {};
  const prior = performed(e.exId, s.id, s.end ? s.start : null);
  const res = {};
  for (const set of [...e.sets]) {
    if (!(set.done && !set.warm && set.r > 0)) continue;
    const tw = set.w * factor(e.mode);
    const k = prKind(tw, set.r, prior);
    if (k) res[set.id] = k;
    prior.push({ tw, r: set.r });
  }
  return res;
}
const PR = { weight: { label: 'Gewichts-PR', color: 'var(--gold)' }, reps: { label: 'Wdh.-PR', color: 'var(--cyan)' } };

// ---------- Navigation ----------
const page = () => U.stack[U.tab][U.stack[U.tab].length - 1] || null;
const pageKey = () => U.tab + ':' + U.stack[U.tab].map(p => p.type + (p.id || '')).join('/');
function push(p) { U.scroll[pageKey()] = window.scrollY; U.stack[U.tab].push(p); U.editSession = false; render(true); }
function back() { U.stack[U.tab].pop(); U.editSession = false; U.editEntry = null; render(); }

// ---------- Darstellung ----------
function render(toTop = false) {
  if (!S) { renderError(); return; }
  const before = pageKey();
  const p = page();
  let view;
  switch (U.tab) {
    case 'overview': view = p?.type === 'exercise' ? vExercise(p.id) : vOverview(); break;
    case 'training': view = activeSession() ? vWorkout() : vStart(); break;
    case 'history': view = p?.type === 'session' ? vSession(p.id) : vHistory(); break;
    case 'stats': view = vStats(); break;
    case 'more': view = vMoreRouter(p); break;
  }
  if (!view) { U.stack[U.tab] = []; return render(); }
  document.getElementById('top').innerHTML = `<div class="top-in"><div class="top-side">${view.left || ''}</div><div class="top-title">${view.title ? esc(view.title) : ''}</div><div class="top-side r">${view.right || ''}</div></div>`;
  document.getElementById('app').innerHTML = view.html;
  renderTabs();
  renderTimer();
  const key = pageKey();
  window.scrollTo(0, toTop ? 0 : (U.scroll[key] ?? (key === before ? window.scrollY : 0)));
}
const backBtn = (label = 'Zurück') => `<button class="tbtn" data-a="back">${ICON.back}<span>${esc(label)}</span></button>`;

function renderTabs() {
  const tabs = [
    ['overview', 'Übersicht', ICON.grid], ['training', 'Training', ICON.dumbbell],
    ['history', 'Verlauf', ICON.cal], ['stats', 'Statistik', ICON.chart], ['more', 'Verwalten', ICON.sliders],
  ];
  const act = !!activeSession();
  document.getElementById('tabs').innerHTML = `<div class="tabs-in">${tabs.map(([k, l, i]) =>

}

function renderError() {
  document.getElementById('app').innerHTML = `<div class="empty"><b>Daten konnten nicht gelesen werden</b>
    Es wurde nichts überschrieben. Lade die Rohdaten herunter und schick sie dir zur Sicherheit.<br><br>
    <button class="btn green" data-a="rawExport">Rohdaten sichern</button><p class="note">${esc(loadError?.message)}</p></div>`;
}

// ---------- Übersicht ----------
function vOverview() {
  const act = activeSession();
  const groups = groupsSorted();
  const vis = U.filter ? groups.filter(g => g.id === U.filter) : groups;
  let h = `<div class="big-title">Kraftbuch</div>`;
  if (act) h += banner(act);
  h += `<div class="chips"><button class="chip ${!U.filter ? 'on' : ''}" data-a="filter" data-id="">Alle</button>${groups.map(g =>
    `<button class="chip ${U.filter === g.id ? 'on' : ''}" style="${U.filter === g.id ? 'color:' + g.color : ''}" data-a="filter" data-id="${g.id}"><span class="dot" style="background:${g.color}"></span><span style="color:#fff">${esc(g.name)}</span></button>`).join('')}</div>`;

function banner(s) {

    <span style="color:var(--accent);font-weight:600">Öffnen</span></button>`;
}
function groupSection(name, color, exs) {

    exs.map(ex => exCard(ex, color)).join('');
}
function exCard(ex, color) {
  const fin = finished(ex.id), last = fin[0], rec = records(ex.id);
  const act = activeSession(), actEntry = act?.entries.find(e => e.exId === ex.id);

  if (last) {
    const sd = last.s.dateUnknown ? '' : `<b class="small">${fDate(last.s.start)}${relDays(last.s.start) !== fDate(last.s.start) ? ' · ' + relDays(last.s.start) : ''}</b>`;
    body += `<div class="row small" style="margin-top:6px"><span class="muted">Letztes Training</span>${sd}${last.s.baseline ? '<span class="pill base">Ausgangswert</span>' : ''}</div>
      <div class="sets-line">${setsText(working(last.e))} <span class="faint small">${unitOf(last.e.mode)}</span></div>`;
  } else {

  }

  if (rec.heaviest) {
    const h = rec.heaviest;
    body += `<div class="pr-line" style="margin-top:6px"><span class="trophy">🏆</span> PR ${kg(h.tw / factor(ex.mode))} × ${h.r} ${unit} <span class="muted" style="font-weight:400">· ${h.base ? 'Ausgangswert' : fDate(h.date)}</span></div>`;
  }
  return `<button class="card ex-card" data-a="openEx" data-id="${ex.id}"><span class="stripe" style="background:${color}"></span><span class="grow">${body}</span></button>`;
}

// ---------- Übungsdetails ----------
function vExercise(id) {
  const ex = exById(id); if (!ex) return null;
  const fin = finished(id), rec = records(id), unit = unitOf(ex.mode), f = factor(ex.mode);
  const g = grpById(ex.groupId);
  let h = `<div class="big-title" style="font-size:26px">${esc(ex.name)}</div><div class="row" style="flex-wrap:wrap;margin:-6px 0 12px">
    ${g ? `<span class="pill" style="background:${g.color}2e;color:${g.color}">${esc(g.name)}</span>` : ''}<span class="pill">${modeLabel(ex.mode)}</span>
    ${rec.sessions ? `<span class="pill">${rec.sessions}× trainiert</span>` : ''}</div>`;
  if (ex.notes) h += `<p class="muted small" style="margin:-4px 0 12px">${esc(ex.notes)}</p>`;
  const hv = rec.heaviest, mr = rec.mostReps, b = rec.best;
  const when = p => p.base ? 'Ausgangswert' : fDate(p.date);
  h += `<div class="tiles">
    ${tile('Schwerstes Gewicht', hv ? `${kg(hv.tw / f)} ${unit}` : '–', hv ? `× ${hv.r} · ${when(hv)}` : '')}
    ${tile('Meiste Wiederholungen', mr ? `${mr.r} Wdh.` : '–', mr ? `mit ${kg(mr.tw / f)} ${unit} · ${when(mr)}` : '')}
    ${tile('Geschätztes 1RM', b ? `${kg(Math.round(rec.bestVal / f * 10) / 10)} ${unit}` : '–', b ? `aus ${kg(b.tw / f)} × ${b.r}` : '')}
    ${tile('Letztes Training', fin[0] ? (fin[0].s.baseline ? 'Alter Plan' : fDate(fin[0].s.start)) : '–', fin[0] ? (fin[0].s.dateUnknown ? 'Ausgangswert · Datum unbekannt' : relDays(fin[0].s.start)) : '')}
  </div><p class="note">1RM nach Epley: Gewicht × (1 + Wdh. ÷ 30), nur bei Sätzen bis 12 Wdh. Aufwärmsätze zählen nicht.</p>`;
  if (fin.length) {
    h += `<div class="card"><div class="h2">Vergleich</div>${compareRow('Letztes Training', fin[0])}${fin[1] ? '<div style="height:.5px;background:var(--line);margin:10px 0"></div>' + compareRow('Vorheriges Training', fin[1]) : ''}</div>`;
  }
  if (fin.length >= 2) {
    const m = U.metric;
    const pts = [...fin].reverse().map(({ s, e }) => {
      const ws = working(e); let y = null;
      if (m === 'heaviest') y = Math.max(...ws.map(x => x.w * factor(e.mode))) / f;
      if (m === 'e1rm') { const v = ws.map(x => e1rm(x.w * factor(e.mode), x.r)).filter(Boolean); y = v.length ? Math.max(...v) / f : null; }
      if (m === 'volume') y = entryVol(e);
      return { y, label: s.dateUnknown ? 'AW' : fShort(s.start), base: s.baseline };
    }).filter(p => p.y != null);
    h += `<div class="card"><div class="h2">Fortschritt</div><div class="seg">${[['heaviest', 'Schwerster Satz'], ['e1rm', '1RM (geschätzt)'], ['volume', 'Volumen']].map(([k, l]) =>
      `<button class="${m === k ? 'on' : ''}" data-a="metric" data-m="${k}">${l}</button>`).join('')}</div>${lineChart(pts, exColor(ex), m === 'volume' ? 'kg' : unit)}</div>`;
  }
  h += `<div class="card"><div class="h2">Trainingsverlauf</div>${fin.length ? fin.map(({ s, e }, i) => histRow(s, e) + (i < fin.length - 1 ? '<div style="height:.5px;background:var(--line);margin:10px 0"></div>' : '')).join('') : '<div class="faint small">Noch keine Trainings gespeichert.</div>'}</div>`;
  h += `<button class="btn orange" data-a="baselineForm" data-id="${ex.id}">${iconSmall(ICON.clock, 16)} Historischen Ausgangswert eintragen</button>`;
  return { title: '', left: backBtn('Übersicht'), right: `<button class="tbtn" data-a="editEx" data-id="${ex.id}">Bearbeiten</button>`, html: h };
}
const tile = (t, v, d) => `<div class="tile"><div class="t">${t}</div><div class="v">${v}</div><div class="d">${d || '&nbsp;'}</div></div>`;
function compareRow(title, { s, e }) {
  return `<div class="row small"><span class="muted">${title}</span><b>${sessDate(s)}</b>${s.baseline ? '<span class="pill base">Ausgangswert</span>' : ''}</div>
    <div class="sets-line" style="margin-top:2px">${setsText(working(e))} <span class="faint small">${unitOf(e.mode)}</span></div>
    <div class="xs faint">Volumen ${big(entryVol(e))} kg</div>`;
}
function histRow(s, e) {
  const prs = prKinds(s, e);
  return `<div class="row"><b class="small">${sessDate(s)}</b>${s.baseline ? '<span class="pill base">Ausgangswert</span>' : `<span class="xs muted ellip">${esc(s.name)}</span>`}<span class="grow"></span><span class="xs faint mono">${big(entryVol(e))} kg</span></div>
    <div class="set-chips">${e.sets.filter(x => x.done).map(x => `<span class="set-chip ${x.warm ? 'warm' : ''}">${x.warm ? '<span class="w">A</span>' : ''}${kg(x.w)} × ${x.r}${prs[x.id] ? ` <span style="color:${PR[prs[x.id]].color}">🏆</span>` : ''}</span>`).join('')}</div>`;
}

// ---------- Diagramme (SVG) ----------
function lineChart(pts, color, unit) {
  if (pts.length < 2) return '<div class="faint small">Mindestens zwei Trainings nötig.</div>';
  const W = 340, H = 170, L = 38, R = 10, T = 10, B = 24;
  let min = Math.min(...pts.map(p => p.y)), max = Math.max(...pts.map(p => p.y));
  if (min === max) { min -= 5; max += 5; }
  const padY = (max - min) * 0.12; min = Math.max(0, min - padY); max += padY;
  const x = i => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  let g = '';
  for (let k = 0; k <= 3; k++) {
    const v = min + (max - min) * k / 3, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#2c2c2e"/><text x="${L - 6}" y="${yy + 4}" fill="#98989f" font-size="10" text-anchor="end">${kg(Math.round(v))}</text>`;
  }
  const line = pts.map((p, i) => `${x(i)},${y(p.y)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="${p.base ? 4.5 : 3.5}" fill="${p.base ? '#FF9F0A' : color}" stroke="#1c1c1e" stroke-width="1.5"/>`).join('');
  const step = Math.max(1, Math.ceil(pts.length / 5));
  const labels = pts.map((p, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${x(i)}" y="${H - 6}" fill="#98989f" font-size="10" text-anchor="middle">${esc(p.label)}</text>` : '').join('');
  const legend = pts.some(p => p.base) ? `<div class="legend"><span class="dot" style="background:var(--orange)"></span>Ausgangswert (AW) aus deinem alten Plan · Einheit: ${unit}</div>` : `<div class="legend">Einheit: ${unit}</div>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>${legend}`;
}
function barChart(vals, color) {
  const W = 340, H = 150, L = 34, R = 6, T = 10, B = 22;
  const max = Math.max(1, ...vals.map(v => v.v));
  const bw = (W - L - R) / vals.length;
  let g = '';
  for (let k = 0; k <= 2; k++) {
    const v = max * k / 2, yy = T + (H - T - B) * (1 - k / 2);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#2c2c2e"/><text x="${L - 5}" y="${yy + 4}" fill="#98989f" font-size="10" text-anchor="end">${v >= 1000 ? kg(Math.round(v / 100) / 10) + 'k' : kg(Math.round(v * 10) / 10)}</text>`;
  }
  vals.forEach((v, i) => {
    const h = (H - T - B) * v.v / max, xx = L + i * bw + bw * 0.18;
    if (v.v > 0) g += `<rect x="${xx}" y="${H - B - h}" width="${bw * 0.64}" height="${h}" rx="3" fill="${color}"/>`;
    if (i % 3 === 0) g += `<text x="${xx + bw * 0.32}" y="${H - 6}" fill="#98989f" font-size="10" text-anchor="middle">${esc(v.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// ---------- Training starten ----------
function vStart() {
  const plans = [...S.plans].sort(bySort);
  let h = `<div class="big-title">Training</div><p class="muted small" style="margin:-8px 0 14px">Welchen Tag trainierst du heute?</p>`;
  for (const p of plans) {
    const exs = p.exIds.map(exById).filter(Boolean);
    const colors = [...new Set(exs.map(exColor))];
    const lastReal = exs.map(ex => finished(ex.id).find(x => !x.s.baseline)?.s.start).filter(Boolean);
    h += `<button class="card row" style="width:100%;text-align:left" data-a="startPlan" data-id="${p.id}">
      <span style="display:flex;flex-direction:column;gap:3px;width:10px">${(colors.length ? colors : ['#636366']).slice(0, 4).map(c => `<span class="dot" style="background:${c}"></span>`).join('')}</span>

function entryBlock(s, e, i) {

    h += `<div class="prev-box"><div class="row xs"><span class="muted">Letztes Mal${prev.s.baseline ? '' : ' · ' + fDate(prev.s.start)}</span>${prev.s.baseline ? '<span class="pill base">Ausgangswert</span>' : ''}</div>

// ---------- Statistik ----------
function weeks() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const wd = (now.getDay() + 6) % 7; // Montag = 0
  const thisMon = now.getTime() - wd * 86400000;
  const real = S.sessions.filter(s => s.end && !s.baseline);
  const out = [];
  for (let i = 11; i >= 0; i--) {
    const st = new Date(thisMon); st.setDate(st.getDate() - i * 7);
    const en = new Date(st); en.setDate(en.getDate() + 7);
    const inW = real.filter(s => s.start >= st.getTime() && s.start < en.getTime());
    out.push({ start: st.getTime(), count: inW.length, vol: inW.reduce((a, s) => a + sessVol(s), 0) });
  }
  return out;
}
function vStats() {
  const real = S.sessions.filter(s => s.end && !s.baseline);
  const now = new Date();
  const month = real.filter(s => { const d = new Date(s.start); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).length;
  const w = weeks();
  const per = w.slice(-8).reduce((a, x) => a + x.count, 0) / 8;
  const vol = real.reduce((a, s) => a + sessVol(s), 0);
  let h = `<div class="big-title">Statistik</div><div class="tiles">
    ${tile('Workouts gesamt', real.length, 'ohne Ausgangswerte')}${tile('Diesen Monat', month, MONTHS[now.getMonth()])}
    ${tile('Ø pro Woche', kg(Math.round(per * 10) / 10), 'letzte 8 Wochen')}${tile('Volumen gesamt', vol >= 1000 ? kg(Math.round(vol / 100) / 10) + ' t' : big(vol) + ' kg', big(vol) + ' kg')}</div>`;
  h += `<div class="card"><div class="h2">Trainingshäufigkeit</div><div class="xs muted" style="margin:-6px 0 8px">Workouts pro Woche · letzte 12 Wochen</div>${barChart(w.map(x => ({ v: x.count, label: fShort(x.start) })), '#30D158')}</div>`;
  h += `<div class="card"><div class="h2">Trainingsvolumen</div><div class="xs muted" style="margin:-6px 0 8px">kg pro Woche (Gewicht × Wdh., ohne Aufwärmsätze)</div>${barChart(w.map(x => ({ v: x.vol, label: fShort(x.start) })), '#0A84FF')}</div>`;
  const trained = S.exercises.filter(ex => finished(ex.id).length).sort((a, b) => (grpById(a.groupId)?.sort ?? 99) - (grpById(b.groupId)?.sort ?? 99) || a.sort - b.sort);
  const sel = trained.find(e => e.id === U.statsEx) || trained.find(e => finished(e.id).length >= 2) || trained[0];
  if (sel) {
    const f = factor(sel.mode);
    const pts = [...finished(sel.id)].reverse().map(({ s, e }) => {
      const v = working(e).map(x => e1rm(x.w * factor(e.mode), x.r)).filter(Boolean);
      return { y: v.length ? Math.max(...v) / f : null, label: s.dateUnknown ? 'AW' : fShort(s.start), base: s.baseline };
    }).filter(p => p.y != null);
    h += `<div class="card"><div class="row between" style="margin-bottom:8px"><div class="h2" style="margin:0">Kraftfortschritt</div></div>
      <select class="inp" style="margin-bottom:10px;padding:10px 12px" data-in="statsEx">${trained.map(e => `<option value="${e.id}" ${e.id === sel.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
      <div class="xs muted" style="margin-bottom:6px">Geschätztes 1RM pro Training</div>${lineChart(pts, exColor(sel), unitOf(sel.mode))}</div>`;
  }
  h += `<div class="card"><div class="h2">Persönliche Rekorde</div>${trained.length ? '' : '<div class="faint small">Noch keine Rekorde.</div>'}`;
  trained.forEach((ex, i) => {
    const r = records(ex.id), f = factor(ex.mode), u = unitOf(ex.mode);
    h += `<div class="row" style="padding:8px 0;align-items:flex-start;${i ? 'border-top:.5px solid var(--line)' : ''}">
      <span class="dot" style="background:${exColor(ex)};margin-top:6px"></span>
      <span class="grow"><b class="small">${esc(ex.name)}</b>${r.best ? `<br><span class="xs muted">1RM ≈ ${kg(Math.round(r.bestVal / f * 10) / 10)} ${u}</span>` : ''}</span>
      ${r.heaviest ? `<span style="text-align:right"><b class="small mono" style="color:var(--gold)">${kg(r.heaviest.tw / f)} × ${r.heaviest.r} ${u}</b><br><span class="xs ${r.heaviest.base ? '' : 'faint'}" style="${r.heaviest.base ? 'color:var(--orange)' : ''}">${r.heaviest.base ? 'Ausgangswert' : fDate(r.heaviest.date)}</span></span>` : ''}</div>`;
  });
  h += '</div>';
  return { title: '', html: h };
}

// ---------- Pausentimer ----------
let audioCtx = null;
function unlockAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
}
function beep() {
  try {
    if (!audioCtx) return;
    [0, 0.25, 0.5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const st = audioCtx.currentTime + t; g.gain.setValueAtTime(0.25, st); g.gain.exponentialRampToValueAtTime(0.001, st + 0.18);
      o.start(st); o.stop(st + 0.2);
    });
  } catch (_) {}
}
function startRest(sec) { S.timer = { end: Date.now() + sec * 1000, dur: sec * 1000 }; save(); renderTimer(); }
function stopRest() { S.timer = null; save(); renderTimer(); }
function renderTimer() {
  const el = document.getElementById('timer');
  const show = S && activeSession() && U.tab === 'training';
  document.body.classList.toggle('has-timer', !!show);
  if (!show) { el.innerHTML = ''; return; }
  const t = S.timer;
  if (t && t.end > Date.now()) {
    el.innerHTML = `<div class="t-prog" id="t-prog"></div><div class="timer-in"><span class="muted small">Pause</span><span class="t-left" id="t-left"></span><span class="grow"></span>
      <button class="tchip" data-a="restAdj" data-d="-15">−15</button><button class="tchip" data-a="restAdj" data-d="15">+15</button><button class="tchip" data-a="restStop">✕</button></div>`;
    tickTimer();
  } else {
    el.innerHTML = `<div class="timer-in"><span class="muted">${iconSmall(ICON.timer, 18)}</span><span class="muted small">Pause</span><span class="grow"></span>
      ${[60, 90, 120, 180].map(v => `<button class="tchip ${v === S.settings.rest ? 'hl' : ''}" data-a="restStart" data-v="${v}">${dur(v * 1000)}</button>`).join('')}</div>`;
  }
}
function tickTimer() {
  const t = S?.timer; if (!t) return;
  const left = t.end - Date.now();
  if (left <= 0) {
    S.timer = null; save(); renderTimer(); beep();
    document.body.classList.add('flash'); setTimeout(() => document.body.classList.remove('flash'), 2000);
    return;
  }
  const l = document.getElementById('t-left'), p = document.getElementById('t-prog');
  if (l) l.textContent = dur(left + 999);
  if (p) p.style.width = (100 * left / t.dur) + '%';
}
setInterval(() => {
  if (!S) return;
  tickTimer();
  document.querySelectorAll('[data-elapsed]').forEach(el => { const s = sessById(el.dataset.elapsed); if (s) el.textContent = dur(elapsed(s)); });
}, 500);

// ---------- Aktionen ----------
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
const findSet = d => { const s = sessById(d.s), e = s?.entries.find(x => x.id === d.e), set = e?.sets.find(x => x.id === d.set); return { s, e, set }; };
const lastEntry = exId => finished(exId)[0] || null;

function addEntry(s, ex) {
  const prev = lastEntry(ex.id);
  const tmpl = prev ? prev.e.sets.filter(x => x.done) : [];
  const n = tmpl.length || 3;
  const g = grpById(ex.groupId);
  s.entries.push({
    id: uid(), exId: ex.id, name: ex.name, group: g?.name || '', color: g?.color || '#8E8E93', mode: ex.mode,
    sets: Array.from({ length: n }, (_, i) => ({ id: uid(), w: 0, r: 0, warm: !!tmpl[i]?.warm, done: false, at: null })),
  });
}
function finishWorkout() {
  const s = activeSession();
  if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; }
  s.entries.forEach(e => { e.sets = e.sets.filter(x => x.done && x.r > 0); });
  s.entries = s.entries.filter(e => e.sets.length);
  s.end = Date.now();
  S.timer = null;
  const prs = [];
  for (const e of s.entries) { const k = prKinds(s, e); for (const set of e.sets) if (k[set.id]) prs.push({ name: e.name, k: k[set.id], txt: `${kg(set.w)} × ${set.r} ${unitOf(e.mode)}` }); }
  save();
  return { name: s.name, dur: elapsed(s), ex: s.entries.length, sets: sessSets(s), vol: sessVol(s), prs };
}

const A = {
  tab(d) {

  startPlan(d) {

    const s = { id: uid(), name: p ? p.name : 'Freies Workout', start: Date.now(), end: null, pausedAt: null, pausedMs: 0, baseline: false, entries: [] };
    if (p) p.exIds.map(exById).filter(Boolean).forEach(ex => addEntry(s, ex));
    S.sessions.push(s); save(); render(true);
  },
  pause() {
    const s = activeSession(); if (!s) return;

  },
  toggleWarm(d) { const { set } = findSet(d); if (!set) return; set.warm = !set.warm; save(); render(); },
  toggleSet(d) {
    const { s, e, set } = findSet(d); if (!set) return;
    if (set.done) { set.done = false; set.at = null; save(); render(); return; }
    const idx = e.sets.indexOf(set);
    const prev = e.exId ? lastEntry(e.exId) : null;
    const p = prev ? prev.e.sets.filter(x => x.done)[idx] : null;
    if (!set.w && !set.r && p) { set.w = p.w; set.r = p.r; }
    if (!(set.r > 0)) { toast('Bitte Wiederholungen eintragen'); return; }
    document.activeElement?.blur();
    set.done = true; set.at = Date.now(); save();
    if (S.settings.autoRest) startRest(set.warm ? Math.min(60, S.settings.rest) : S.settings.rest);
    render();
  },
  addSet(d) {
    const { e } = findSet(d); if (!e) return;
    const last = e.sets[e.sets.length - 1];
    e.sets.push({ id: uid(), w: last?.w || 0, r: last?.r || 0, warm: false, done: !!sessById(d.s)?.end, at: null });
    save(); render();
  },
  delSet(d) { const { e, set } = findSet(d); if (!set) return; e.sets = e.sets.filter(x => x !== set); save(); render(); },
  adopt(d) {
    const s = activeSession(), e = s.entries.find(x => x.id === d.e), prev = lastEntry(e.exId); if (!prev) return;
    prev.e.sets.filter(x => x.done).forEach((p, i) => {
      const cur = e.sets[i];
      if (cur) { if (!cur.done) { cur.w = p.w; cur.r = p.r; cur.warm = p.warm; } }
      else e.sets.push({ id: uid(), w: p.w, r: p.r, warm: p.warm, done: false, at: null });
    });
    save(); render();
  },
  entryMenu(d) { openModal({ type: 'entryMenu', e: d.e }); },
  editEntry(d) { U.editEntry = d.e || null; closeModal(); render(); },
  moveEntry(d) {

  },

  finishDialog() { openModal({ type: 'finish' }); },

  discard() {

    const s = activeSession(); S.sessions = S.sessions.filter(x => x !== s); S.timer = null; save(); closeModal(); render(true);
  },
  restStart(d) { startRest(Number(d.v)); },
  restStop() { stopRest(); },
  restAdj(d) {
    if (!S.timer) return; S.timer.end += Number(d.d) * 1000; S.timer.dur = Math.max(S.timer.dur + Number(d.d) * 1000, S.timer.end - Date.now());
    if (S.timer.end <= Date.now()) S.timer = null; save(); renderTimer();
  },

  picker(d) { U.pickSearch = ''; openModal({ type: 'picker', ctx: d.ctx, p: d.p }); },
  pick(d) {
    const m = U.modal, ex = exById(d.id); if (!ex) return;

    else { const p = planById(m.p); if (p && !p.exIds.includes(ex.id)) p.exIds.push(ex.id); }

  pickNew() { const m = U.modal; openModal({ type: 'exEdit', id: null, after: { ctx: m.ctx, p: m.p } }); },

  editEx(d) { openModal({ type: 'exEdit', id: d.id || null }); },

    let ex = m.id ? exById(m.id) : null;
    const gid = d.groupId || null;
    const nextSort = () => Math.max(-1, ...exOfGroup(gid).map(x => x.sort)) + 1;
    if (ex) {
      if ((ex.groupId || null) !== gid) { ex.groupId = gid; ex.sort = nextSort(); }
      if (d.applyPast && d.mode !== ex.mode) S.sessions.forEach(s => s.entries.forEach(e => { if (e.exId === ex.id) e.mode = d.mode; }));
      ex.name = name; ex.mode = d.mode; ex.notes = d.notes.trim();
    } else {
      ex = { id: uid(), name, groupId: gid, mode: d.mode, notes: d.notes.trim(), sort: nextSort() };
      S.exercises.push(ex);
      if (m.after) {
        if (m.after.ctx === 'workout') { const s = activeSession(); if (s) addEntry(s, ex); }
        else if (m.after.ctx === 'plan') { const p = planById(m.after.p); if (p) p.exIds.push(ex.id); }
      }
    }
    save(); closeModal(); render();
  },
  deleteEx(d) {
    const ex = exById(d.id);
    if (!confirm(`„${ex.name}“ löschen? Trainings im Verlauf bleiben erhalten.`)) return;
    S.exercises = S.exercises.filter(x => x.id !== d.id);
    S.plans.forEach(p => { p.exIds = p.exIds.filter(x => x !== d.id); });
    save(); closeModal();
    if (page()?.type === 'exercise' && page().id === d.id) U.stack[U.tab].pop();
    render();
  },
  editGroup(d) { openModal({ type: 'groupEdit', id: d.id || null }); },
  draftColor(d) { U.modal.d.color = d.c; renderModal(); },
  saveGroup() {
    const m = U.modal, name = m.d.name.trim();
    if (!name) return toast('Bitte einen Namen eingeben');
    if (S.groups.some(x => x.id !== m.id && x.name.toLowerCase() === name.toLowerCase())) return toast('Diese Muskelgruppe gibt es schon');
    if (m.id) { const g = grpById(m.id); g.name = name; g.color = m.d.color; }
    else S.groups.push({ id: uid(), name, color: m.d.color, sort: Math.max(-1, ...S.groups.map(x => x.sort)) + 1 });
    save(); closeModal(); render();
  },
  deleteGroup(d) {
    const g = grpById(d.id);
    if (!confirm(`Muskelgruppe „${g.name}“ löschen? Die Übungen bleiben erhalten.`)) return;
    S.exercises.forEach(ex => { if (ex.groupId === d.id) ex.groupId = null; });
    S.groups = S.groups.filter(x => x.id !== d.id);
    if (U.filter === d.id) U.filter = null;
    save(); closeModal(); render();
  },
  move(d) {
    const dir = Number(d.d);
    let arr;
    if (d.k === 'ex') { const ex = exById(d.id); arr = exOfGroup(ex.groupId || null); }
    else if (d.k === 'group') arr = groupsSorted();
    else if (d.k === 'plan') arr = [...S.plans].sort(bySort);
    else if (d.k === 'planItem') {
      const p = planById(d.p), i = p.exIds.indexOf(d.id), j = i + dir;
      if (j < 0 || j >= p.exIds.length) return;
      [p.exIds[i], p.exIds[j]] = [p.exIds[j], p.exIds[i]]; save(); render(); return;
    }
    const i = arr.findIndex(x => x.id === d.id), j = i + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]]; arr.forEach((x, k) => { x.sort = k; });
    save(); render();
  },
  newPlan() {
    const p = { id: uid(), name: 'Neuer Plan', sort: Math.max(-1, ...S.plans.map(x => x.sort)) + 1, exIds: [] };
    S.plans.push(p); save(); push({ type: 'plan', id: p.id });
  },
  removePlanItem(d) { const p = planById(d.p); p.exIds = p.exIds.filter(x => x !== d.id); save(); render(); },
  deletePlan(d) {
    const p = planById(d.id);
    if (!confirm(`Plan „${p.name}“ löschen? Übungen und Verlauf bleiben erhalten.`)) return;
    S.plans = S.plans.filter(x => x.id !== d.id); save(); back();
  },

  baselineForm(d) { U.draft = null; openModal({ type: 'baseline', id: d.id }); },
  draftWarm(d) { U.draft.sets[d.i].warm = !U.draft.sets[d.i].warm; renderModal(); },
  draftDel(d) { U.draft.sets.splice(Number(d.i), 1); renderModal(); },
  draftAdd() { const l = U.draft.sets[U.draft.sets.length - 1]; U.draft.sets.push({ w: l?.w || 0, r: l?.r || 0, warm: false }); renderModal(); },
  saveBaseline() {
    const ex = exById(U.modal.id), d = U.draft;
    const sets = d.sets.filter(s => s.r > 0);
    if (!sets.length) return toast('Mindestens einen Satz mit Wiederholungen eintragen');
    let start;
    if (d.unknown) {
      // Unbekanntes Datum: vor allen echten Workouts einsortieren
      const firstReal = Math.min(Date.now(), ...S.sessions.filter(s => !s.baseline).map(s => s.start));
      const lastBase = Math.max(0, ...S.sessions.filter(s => s.baseline && s.dateUnknown).map(s => s.start));
      start = Math.max(lastBase + 1000, 0); if (start >= firstReal) start = firstReal - 1000;
    } else { const [y, mo, da] = d.date.split('-').map(Number); start = new Date(y, mo - 1, da, 12).getTime(); }
    const g = grpById(ex.groupId);
    S.sessions.push({
      id: uid(), name: 'Ausgangswert', start, end: start, pausedAt: null, pausedMs: 0, baseline: true, dateUnknown: !!d.unknown,
      entries: [{ id: uid(), exId: ex.id, name: ex.name, group: g?.name || '', color: g?.color || '#8E8E93', mode: ex.mode, sets: sets.map(s => ({ id: uid(), w: s.w, r: s.r, warm: s.warm, done: true, at: start })) }],
    });
    save(); closeModal(); render(); toast('Ausgangswert gespeichert');
  },

  editSession() {
    if (U.editSession) { const s = sessById(page().id); if (s) { s.entries.forEach(e => { e.sets = e.sets.filter(x => x.r > 0); }); s.entries = s.entries.filter(e => e.sets.length); save(); } }
    U.editSession = !U.editSession; render();
  },
  deleteSession(d) {
    if (!confirm('Dieses Workout dauerhaft löschen? Das kann nicht rückgängig gemacht werden.')) return;
    S.sessions = S.sessions.filter(s => s.id !== d.id); save(); U.editSession = false; back();
  },

  exportJson() {
    const data = JSON.stringify({ app: 'Kraftbuch', version: 1, exportedAt: new Date().toISOString(), data: { ...S, timer: null } }, null, 2);
    S.settings.lastExport = Date.now(); save();
    shareFile(`Kraftbuch-Backup-${isoDay(Date.now())}.json`, data, 'application/json'); render();
  },
  exportCsv() { shareFile(`Kraftbuch-${isoDay(Date.now())}.csv`, makeCsv(), 'text/csv'); },
  importJson() { document.getElementById('importFile').click(); },
  rawExport() { shareFile('Kraftbuch-Rohdaten.json', loadError?.raw || '', 'application/json'); },
};

function makeCsv() {
  const q = v => /[;"\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const rows = [['Datum', 'Uhrzeit', 'Workout', 'Typ', 'Übung', 'Muskelgruppe', 'Satz', 'Aufwärmsatz', 'Gewicht', 'Gewichtsangabe', 'Gesamtgewicht (kg)', 'Wiederholungen', 'Geschätztes 1RM (kg)']];
  for (const s of S.sessions.filter(x => x.end).sort((a, b) => a.start - b.start)) {
    for (const e of s.entries) {
      let n = 0;
      for (const set of e.sets.filter(x => x.done)) {
        const tw = set.w * factor(e.mode), r1 = set.warm ? null : e1rm(tw, set.r);
        rows.push([s.dateUnknown ? 'unbekannt' : fDate(s.start), s.baseline ? '' : fTime(s.start), s.name, s.baseline ? 'Ausgangswert' : 'Training', e.name,
          grpById(exById(e.exId)?.groupId)?.name || e.group, set.warm ? 'A' : ++n, set.warm ? 'ja' : 'nein', kg(set.w), modeLabel(e.mode), kg(tw), set.r, r1 ? kg(Math.round(r1 * 10) / 10) : '']);
      }
    }
  }
  return '﻿' + rows.map(r => r.map(q).join(';')).join('\n') + '\n';
}
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// Import: fügt nur hinzu, was fehlt – überschreibt nie etwas.
function importBackup(obj) {
  const src = obj?.data;
  if (obj?.app !== 'Kraftbuch' || !src || !Array.isArray(src.sessions)) throw new Error('Keine Kraftbuch-Backup-Datei.');
  const r = { g: 0, ex: 0, p: 0, s: 0, skip: 0 };
  const gMap = {}, exMap = {};
  for (const g of src.groups || []) {
    const hit = S.groups.find(x => x.id === g.id) || S.groups.find(x => x.name.toLowerCase() === g.name.toLowerCase());
    if (hit) gMap[g.id] = hit.id;
    else { S.groups.push({ ...g, sort: Math.max(-1, ...S.groups.map(x => x.sort)) + 1 }); gMap[g.id] = g.id; r.g++; }
  }
  for (const ex of src.exercises || []) {
    const hit = S.exercises.find(x => x.id === ex.id) || S.exercises.find(x => x.name.toLowerCase() === ex.name.toLowerCase());
    if (hit) exMap[ex.id] = hit.id;
    else { S.exercises.push({ ...ex, groupId: ex.groupId ? (gMap[ex.groupId] || null) : null }); exMap[ex.id] = ex.id; r.ex++; }
  }
  for (const p of src.plans || []) {
    if (S.plans.some(x => x.id === p.id || x.name.toLowerCase() === p.name.toLowerCase())) continue;
    S.plans.push({ ...p, exIds: (p.exIds || []).map(id => exMap[id]).filter(Boolean), sort: Math.max(-1, ...S.plans.map(x => x.sort)) + 1 }); r.p++;
  }
  for (const s of src.sessions) {
    if (!s.end) continue;
    if (S.sessions.some(x => x.id === s.id)) { r.skip++; continue; }
    S.sessions.push({ ...s, pausedAt: null, entries: s.entries.map(e => ({ ...e, exId: exMap[e.exId] || (S.exercises.find(x => x.name.toLowerCase() === e.name.toLowerCase())?.id ?? null) })) });
    r.s++;
  }
  save();
  return `${r.s} Workouts importiert` + (r.skip ? `\n${r.skip} bereits vorhanden – übersprungen` : '') + (r.ex ? `\n${r.ex} neue Übungen` : '') + (r.g ? `\n${r.g} neue Muskelgruppen` : '') + (r.p ? `\n${r.p} neue Pläne` : '');
}

// ---------- Eingaben ----------
const IN = {
  set(el) {
    const { set } = findSet(el.dataset); if (!set) return;
    set[el.dataset.f] = el.dataset.f === 'r' ? Math.floor(parseNum(el.value)) : parseNum(el.value);
    save();
  },
  draftEx(el) {
    const d = U.modal.d;
    if (el.type === 'checkbox') d[el.dataset.f] = el.checked; else d[el.dataset.f] = el.value;
    if (el.dataset.f === 'groupId') renderModal();
  },
  draftGroup(el) { U.modal.d[el.dataset.f] = el.value; },
  draftBase(el) { if (el.type === 'checkbox') { U.draft.unknown = el.checked; renderModal(); } else U.draft.date = el.value || isoDay(Date.now()); },
  draftSet(el) { const s = U.draft.sets[el.dataset.i]; s[el.dataset.f] = el.dataset.f === 'r' ? Math.floor(parseNum(el.value)) : parseNum(el.value); },
  pickSearch(el) {
    U.pickSearch = el.value;
    const m = U.modal;
    const excluded = new Set(m.ctx === 'workout' ? (activeSession()?.entries.map(e => e.exId) || []) : (planById(m.p)?.exIds || []));
    const q = el.value.trim().toLowerCase();
    document.getElementById('pick-list').innerHTML = pickList(excluded, ex => !q || ex.name.toLowerCase().includes(q));
  },
  sessName(el) { const s = sessById(el.dataset.s); s.name = el.value || 'Workout'; save(); },
  sessDate(el) {
    if (!el.value) return;
    const s = sessById(el.dataset.s), old = new Date(s.start), [y, mo, da] = el.value.split('-').map(Number);
    const ns = new Date(y, mo - 1, da, s.dateUnknown ? 12 : old.getHours(), s.dateUnknown ? 0 : old.getMinutes()).getTime();
    const delta = ns - s.start; s.start = ns; s.end = (s.end || ns) + delta; s.dateUnknown = false; save();
  },
  planName(el) { const p = planById(el.dataset.id); p.name = el.value || 'Plan'; save(); document.querySelector('.top-title').textContent = p.name; },
  rest(el) { S.settings.rest = Number(el.value); save(); },
  autoRest(el) { S.settings.autoRest = el.checked; save(); },
  statsEx(el) { U.statsEx = el.value; render(); },
};

document.addEventListener('click', ev => {
  unlockAudio();
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.dataset.a === 'bgClose') { if (ev.target === el) closeModal(); return; }
  const fn = A[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el.dataset, el, ev); }
});
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset?.in && IN[el.dataset.in] && el.type !== 'checkbox' && el.tagName !== 'SELECT') IN[el.dataset.in](el); });
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset?.in && IN[el.dataset.in] && (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date')) IN[el.dataset.in](el); });
document.addEventListener('focusin', ev => { if (ev.target.classList?.contains('num')) setTimeout(() => ev.target.select?.(), 0); });
document.getElementById('importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try { const msg = importBackup(JSON.parse(await f.text())); render(); toast(msg); }
  catch (e) { toast('Import fehlgeschlagen: ' + e.message); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); else if (S) { tickTimer(); render(); } });

// ---------- Start ----------
load();
if (S && activeSession()) U.tab = 'training';
render();
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
